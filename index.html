<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Select Game Store</title><meta name="description" content="Pre-owned PS4 and PS5 games in Port Said, Egypt - Select Game Store"><style>*,*:before,*:after{box-sizing:border-box}html{background:#0a0a0c;color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style id="app-style">
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=Cairo:wght@400;600;700;800&display=swap');
/* Layout: sticky top (admin bar + header with search), compact hero with logo, tabs + genre chips + toolbar, dense cover grid, cart sheet, assistant panel. Committed dark look: black with one red. */
:root{
  --bg:#0a0a0c; --surface:#131316; --surface-2:#1b1b20; --line:#2b2b32;
  --fg:#f5f3f1; --muted:#9d9aa3;
  --red:#d9162b; --red-hot:#ff3a4e; --red-deep:#6f0a16;
  --ok:#3ccf74; --warn:#f0b03a;
  --display:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--red-hot);outline-offset:2px}
.wrap{width:100%;max-width:1280px;margin-inline:auto;padding-inline:16px}
@media(min-width:720px){.wrap{padding-inline:28px}}
.muted{color:var(--muted)}

.annc{background:var(--red);color:#fff;font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:7px 16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.admbar{background:#1a0b0e;border-bottom:1px solid var(--red-deep)}
.admin-in{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding-block:8px}
.admin-in .sp{flex:1}
.admin-in .pill{background:var(--red);color:#fff;font-weight:800;font-size:.72rem;letter-spacing:.16em;padding:4px 9px;border-radius:4px}
.admin-in .hint{font-size:.85rem;color:var(--muted);min-width:0}
.hdr{background:rgba(10,10,12,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{display:grid;grid-template-columns:auto 1fr auto;gap:10px 22px;align-items:center;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand img{height:54px;width:auto;display:block}
.wm{display:flex;flex-direction:column;line-height:1}
.wm b{font-family:var(--display);font-weight:900;font-size:1.75rem;letter-spacing:.05em}
.wm i{font-style:normal;font-size:.6rem;letter-spacing:.44em;color:var(--red-hot);font-weight:700;margin-top:3px}
.search{position:relative;width:100%;max-width:640px;justify-self:center}
.search input[type=search]{width:100%;height:46px;border-radius:999px;background:var(--surface);border:1px solid var(--line);padding:0 44px 0 46px;font-size:1rem}
.search input[type=search]::placeholder{color:var(--muted)}
.search input[type=search]:focus{border-color:var(--red);outline:none;box-shadow:0 0 0 3px rgba(217,22,43,.25)}
.search .ic{position:absolute;left:16px;top:13px;width:20px;height:20px;color:var(--muted);pointer-events:none}
.search .clr{position:absolute;right:8px;top:7px;width:32px;height:32px;border-radius:50%;border:0;background:var(--surface-2);cursor:pointer;font-size:1.1rem;line-height:1}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.7);z-index:5}
.sg{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 12px;cursor:pointer}
.sg:hover,.sg:focus-visible{background:var(--surface-2)}
.sg .mc{width:36px;aspect-ratio:3/4;border-radius:3px;overflow:hidden;background:#000}
.sg .mc svg,.sg .mc img{width:100%;height:100%;display:block;object-fit:cover}
.sg b{display:block;font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sg em{font-style:normal;font-family:var(--display);font-weight:800;font-size:1.15rem}
.sg-all{display:block;width:100%;padding:11px;background:var(--surface-2);border:0;font-weight:700;cursor:pointer;color:var(--red-hot)}
.acts{display:flex;gap:8px}
@media(max-width:760px){
  .hdr-in{grid-template-columns:1fr auto;grid-template-areas:"brand acts" "search search"}
  .brand{grid-area:brand}.acts{grid-area:acts}.search{grid-area:search;max-width:none}
  .brand img{height:40px}.wm b{font-size:1.45rem}
}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;min-height:40px;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:#44444d}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red-hot);border-color:var(--red-hot)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.cart b{background:var(--red);color:#fff;border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:.78rem;padding-inline:6px}
.btn svg{width:18px;height:18px}

.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(55% 130% at 88% 40%,rgba(217,22,43,.32),transparent 62%),linear-gradient(180deg,#0e0e11,var(--bg))}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.028) 0 2px,transparent 2px 24px);pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:center;padding-block:34px}
.hero-logo{justify-self:center}
.hero-logo img{width:clamp(170px,22vw,260px);height:auto;display:block;filter:drop-shadow(0 18px 40px rgba(217,22,43,.35))}
@media(max-width:820px){.hero-in{grid-template-columns:1fr;padding-block:26px}.hero-logo{display:none}}
.eyebrow{font-weight:700;font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:var(--red-hot)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(2.9rem,7.4vw,5.4rem);line-height:.88;text-transform:uppercase;margin:12px 0 14px;text-wrap:balance}
h1 em{font-style:normal;color:var(--red-hot)}
.lead{max-width:52ch;color:#cfcbd2;font-size:1.05rem;margin:0 0 20px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.stats{display:flex;flex-wrap:wrap;gap:12px 30px}
.stats div{display:flex;flex-direction:column;line-height:1}
.stats b{font-family:var(--display);font-weight:900;font-size:2.2rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.upd{margin-top:16px;font-size:.8rem;color:var(--muted)}

.shop{padding-block:30px 60px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab span{color:var(--muted);font-weight:600;margin-left:6px;font-size:.85rem}
.tab[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.tab[aria-pressed=true] span{color:#ffd4d9}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 12px;font-size:.85rem;font-weight:600;color:#cfcbd2;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--red-hot);color:#fff;background:rgba(217,22,43,.18)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding-block:14px 16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.bar .cnt{font-weight:600}
.bar .ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.bar label{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;color:#cfcbd2}
select,input[type=text],input[type=number],input[type=search],input[type=email],input[type=password],textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:40px}
input[type=checkbox]{accent-color:var(--red);width:18px;height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,172px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .18s,border-color .18s}
.card:hover{transform:translateY(-3px);border-color:#4a1d25}
.cov{position:relative;aspect-ratio:3/4;background:#000;cursor:pointer;overflow:hidden}
.cov svg,.cov img{width:100%;height:100%;display:block;object-fit:cover}
.cov text{font-family:var(--display);font-weight:800;fill:#fff;letter-spacing:.01em}
.cov .sb{font-family:var(--body);font-weight:600;letter-spacing:.14em;fill:var(--a)}
.cov .pf{font-family:var(--body);font-weight:700;letter-spacing:.18em}
.tag{position:absolute;top:36px;left:0;background:var(--red);color:#fff;font-weight:800;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;padding:3px 9px 3px 8px;border-radius:0 4px 4px 0}
.oos .cov svg,.oos .cov img{filter:grayscale(1) brightness(.5)}
.band{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);background:rgba(10,10,12,.9);border-block:1px solid var(--red);text-align:center;font-family:var(--display);font-weight:800;letter-spacing:.2em;text-transform:uppercase;padding:7px 4px;font-size:1.05rem}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.meta{color:var(--muted);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl{font-weight:600;font-size:.95rem;line-height:1.25;margin:0;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.ttl:hover{color:var(--red-hot)}
.priceRow{margin-top:auto;padding-top:4px}.stl{min-height:1.2em}
.price{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.price small{font-family:var(--body);font-size:.66rem;font-weight:700;color:var(--muted);margin-right:5px;letter-spacing:.14em}
.st{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;letter-spacing:.04em}
.st i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.st.ok{color:var(--ok)}.st.no{color:var(--muted)}
.card .btn{width:100%;margin-top:4px}
.adm{display:grid;gap:8px;margin-top:6px;padding-top:10px;border-top:1px dashed var(--line)}
.adm .r{display:flex;gap:8px;align-items:center;justify-content:space-between;min-width:0}
.adm .r>label{font-size:.7rem;letter-spacing:.12em;font-weight:700;color:var(--muted);text-transform:uppercase}
.adm input.pin{width:96px;min-width:0;min-height:36px;padding:5px 8px;font-variant-numeric:tabular-nums;text-align:right}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stp button{width:32px;height:34px;border:0;background:var(--surface-2);cursor:pointer;font-size:1.1rem}
.stp span{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;cursor:pointer;background:none;border:0;padding:0}
.sw i{width:38px;height:22px;border-radius:999px;background:#3a3a42;position:relative;transition:background .15s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true] i{background:var(--ok)}
.sw[aria-checked=true] i:after{transform:translateX(16px)}
.more{display:flex;justify-content:center;padding-top:26px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:44px 20px;text-align:center;background:var(--surface)}
.empty h3{font-family:var(--display);font-weight:800;font-size:1.8rem;margin:0 0 6px;text-transform:uppercase}
.empty p{color:var(--muted);margin:0 0 18px}
.empty .cta{justify-content:center;margin:0}

.foot{border-top:1px solid var(--line);background:#07070a;padding-block:36px 100px}
.foot-in{display:grid;grid-template-columns:1.2fr 1fr;gap:28px}
@media(max-width:720px){.foot-in{grid-template-columns:1fr}}
.foot h4{font-family:var(--display);font-size:1.2rem;letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px}
.foot p{margin:0 0 6px;color:#cfcbd2}
.foot .slogan{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--red-hot);text-transform:uppercase;letter-spacing:.04em}
.foot .copy{grid-column:1/-1;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding-top:16px}
.sel{user-select:all}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;border:0;background:var(--red);color:#fff;border-radius:999px;padding:0 20px 0 16px;height:52px;font-weight:700;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 12px 34px rgba(217,22,43,.5)}
.fab:hover{background:var(--red-hot)}
.fab svg{width:22px;height:22px}
.ai{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(410px,calc(100vw - 32px));height:min(620px,calc(100dvh - 100px));z-index:55;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.75);overflow:hidden}
.ai-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1d0c10,var(--surface))}
.ai-h .t{flex:1;min-width:0;line-height:1.15}
.ai-h b{font-family:var(--display);font-weight:800;letter-spacing:.06em;font-size:1.2rem;display:block;text-transform:uppercase}
.ai-h span{font-size:.75rem;color:var(--muted)}
.ai-h img{height:34px;width:auto}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);cursor:pointer;font-size:1.2rem;line-height:1;flex:none}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 13px;border-radius:14px;font-size:.95rem;line-height:1.4;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--red);color:#fff;border-bottom-right-radius:4px}
.m.b{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.m.think{color:var(--muted);font-style:italic}
.mini{border:1px solid var(--red);background:transparent;color:var(--red-hot);border-radius:5px;font-size:.72rem;font-weight:700;padding:1px 7px;margin-left:5px;cursor:pointer;vertical-align:baseline}
.qs{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.qs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:600;cursor:pointer}
.qs button:hover{border-color:var(--red)}
.ai-f{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.ai-f input{flex:1;min-width:0;border-radius:999px;padding-inline:16px}
.ai-f .btn{border-radius:999px}

.sheet{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;background:rgba(0,0,0,.62)}
.sheet-in{width:min(100%,440px);height:100%;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
.sheet-h h2,.mbox h2{font-family:var(--display);font-weight:900;font-size:1.8rem;text-transform:uppercase;margin:0;letter-spacing:.03em}
.sheet-b{flex:1;overflow:auto;padding:12px 16px}
.ln{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ln .mc{width:48px;aspect-ratio:3/4;border-radius:4px;overflow:hidden;background:#000}
.ln .mc svg,.ln .mc img{width:100%;height:100%;object-fit:cover;display:block}
.ln b{font-weight:600;display:block;line-height:1.25}
.ln small{color:var(--muted)}
.ln .rm{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.78rem;text-decoration:underline;padding:0;margin-left:10px}
.sheet-f{padding:16px;border-top:1px solid var(--line);display:grid;gap:10px}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot b{font-family:var(--display);font-size:2rem;font-weight:900}
.note{font-size:.82rem;color:var(--muted);margin:0}
.ordtxt{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:.85rem;max-height:140px;overflow:auto}

.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(0,0,0,.74);padding:16px;overflow:auto}
.mbox{position:relative;width:min(100%,720px);background:var(--surface);border:1px solid var(--line);border-radius:14px;max-height:calc(100dvh - 32px);overflow:auto}
.mbox>.x{position:absolute;right:12px;top:12px;z-index:2}
.pad{padding:20px}
.det-in{display:grid;grid-template-columns:260px 1fr;gap:24px;padding:22px}
@media(max-width:640px){.det-in{grid-template-columns:1fr}.det-cov{max-width:240px}}
.det-cov .cov{border-radius:8px;cursor:default;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.det-info{display:flex;flex-direction:column;gap:12px;min-width:0}
.det-info h2{font-size:2.3rem;line-height:.95;padding-right:40px;text-wrap:balance}
.det-info .price{font-size:2.6rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0;font-size:.92rem}
dt{color:var(--muted)}dd{margin:0;font-weight:600}
.form{display:grid;gap:14px;padding:20px}
.form h2{padding-right:44px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.fld{display:grid;gap:6px;min-width:0}
.fld>label,.fld>span.l{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%}
.fld .help{font-size:.78rem;color:var(--muted)}
.imgrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.imgrow .pv{width:72px;aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:#000;flex:none}
.imgrow .pv svg,.imgrow .pv img{width:100%;height:100%;object-fit:cover;display:block}
.row-end{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:4px}
.row-end .g{display:flex;gap:10px;flex-wrap:wrap}
.danger{color:#ff8b97;border-color:#5a1b24}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:90;background:#fff;color:#0a0a0c;font-weight:700;padding:10px 18px;border-radius:999px;box-shadow:0 14px 40px rgba(0,0,0,.6);max-width:calc(100vw - 32px);text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;overflow:auto;background:radial-gradient(60% 70% at 50% 0%,rgba(217,22,43,.35),transparent 70%),radial-gradient(50% 50% at 90% 100%,rgba(217,22,43,.18),transparent 70%),var(--bg)}
.gate-box{width:min(100%,400px);display:grid;gap:14px;text-align:center;padding:26px 22px;border:1px solid var(--line);border-radius:18px;background:rgba(19,19,22,.92);box-shadow:0 40px 100px rgba(0,0,0,.7)}
.gate-box img.gl{width:150px;max-width:60%;margin:0 auto;display:block}
.gate-box h2{font-size:1.9rem;line-height:1}
.gate-box .sub{color:var(--muted);font-size:.9rem;margin:-6px 0 2px}
.gate .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.gate .seg button{border:0;background:transparent;border-radius:7px;min-height:38px;font-weight:700;cursor:pointer;color:var(--muted)}
.gate .seg button[aria-pressed=true]{background:var(--red);color:#fff}
.gate form{display:grid;gap:10px;text-align:left}
.gate form input{width:100%;min-height:46px;font-size:1rem}
.gate .err{color:#ff8b97;font-size:.85rem;min-height:1.1em;margin:0}
.gate .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
.gate .or:before,.gate .or:after{content:"";height:1px;background:var(--line);flex:1}
.gate .btn{width:100%;min-height:46px}
.gate .fine{font-size:.76rem;color:var(--muted);margin:0}
.acct{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bulk{display:grid;gap:10px;padding:20px}
.bulk .row{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.bulk .row img{width:48px;aspect-ratio:3/4;object-fit:cover;border-radius:4px}
.bulk .row select{width:100%;min-width:0}
.bulk .row small{display:block;color:var(--muted);font-size:.74rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.catrow input{min-width:0}
.catrow .n{color:var(--muted);font-size:.8rem}
input[type=url]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:40px}
.fld input[type=url]{width:100%}
.plats{padding-block:26px 6px}
.plats h2,.howto h2{font-size:1.5rem;margin:0 0 14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.tiles{grid-template-columns:1fr}}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-height:118px;text-align:start;padding:16px 18px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:linear-gradient(135deg,#1c0a0e,#0d0d10 70%);transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--red);transform:translateY(-2px)}
.tile:before{content:attr(data-big);position:absolute;inset-inline-end:10px;top:-8px;font-family:var(--display);font-weight:900;font-size:5.6rem;line-height:1;color:var(--red);opacity:.22;pointer-events:none}
.tile b{font-family:var(--display);font-size:1.7rem;line-height:1;text-transform:uppercase}
.tile span{color:var(--muted);font-size:.88rem}
.tile em{font-style:normal;color:var(--red-hot);font-weight:700;font-size:.82rem}
.howto{padding-block:30px 8px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;counter-reset:s;margin:0;padding:0;list-style:none}
@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.steps{grid-template-columns:1fr}}
.steps li{counter-increment:s;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;position:relative;min-width:0}
.steps li:before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;margin-bottom:10px}
.pay{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.pay span.p{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 14px;font-weight:600;font-size:.9rem}
.priceRow{display:flex;align-items:center;justify-content:space-between;gap:8px}
a.yt{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
a.yt:hover{color:#fff;border-color:#ff0033}
a.yt svg{width:12px;height:12px;color:#ff2a3f}
.buyrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.btn.wa{background:#18a957;border-color:#18a957;color:#fff}
.btn.wa:hover{background:#21c26a;border-color:#21c26a}
.btn.wa svg{width:18px;height:18px}
.langbtn{min-width:56px}
.gate-lang{display:grid;gap:12px}
.gate-lang .btn{min-height:56px;font-size:1.15rem}
.gate .lt{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.82rem;text-decoration:underline;justify-self:center}
.credit{grid-column:1/-1;text-align:center;border-top:1px solid var(--line);padding-top:14px;margin-top:6px;color:#cfcbd2;font-weight:600}
.credit b{color:var(--red-hot)}
.soc{display:flex;gap:10px;flex-wrap:wrap}
.soc a{border:1px solid var(--line);border-radius:999px;padding:4px 12px;text-decoration:none;font-size:.85rem}
.alt-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.dym{margin-top:10px}
.sg-h{padding:8px 14px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#app[dir=rtl]{--display:'Cairo','Big Shoulders Display',sans-serif;--body:'Cairo','Barlow',system-ui,sans-serif}
#app[dir=rtl] *{letter-spacing:0!important;text-transform:none!important}
#app[dir=rtl] .search .ic{left:auto;right:16px}
#app[dir=rtl] .search input[type=search]{padding:0 46px 0 44px}
#app[dir=rtl] .search .clr{right:auto;left:8px}
#app[dir=rtl] .sg{text-align:right}
#app[dir=rtl] .tab span{margin-left:0;margin-right:6px}
#app[dir=rtl] .tag{left:auto;right:0;border-radius:4px 0 0 4px}
#app[dir=rtl] .price small{margin-right:0;margin-left:5px}
#app[dir=rtl] .fab{right:auto;left:16px}
#app[dir=rtl] .ai{right:auto;left:16px}
#app[dir=rtl] .m.u{align-self:flex-start;border-bottom-right-radius:12px;border-bottom-left-radius:4px}
#app[dir=rtl] .m.b{align-self:flex-end;border-bottom-left-radius:12px;border-bottom-right-radius:4px}
#app[dir=rtl] .mini{margin-left:0;margin-right:5px}
#app[dir=rtl] .sheet-in{border-left:0;border-right:1px solid var(--line)}
#app[dir=rtl] .ln .rm{margin-left:0;margin-right:10px}
#app[dir=rtl] .mbox>.x{right:auto;left:12px}
#app[dir=rtl] .det-info h2,#app[dir=rtl] .form h2{padding-right:0;padding-left:44px}
#app[dir=rtl] .gate form{text-align:right}
#app[dir=rtl] .sw i:after{left:auto;right:3px}
#app[dir=rtl] .sw[aria-checked=true] i:after{transform:translateX(-16px)}
#app[dir=rtl] h1,#app[dir=rtl] h2,#app[dir=rtl] h3{line-height:1.15}
.buyrow .btn.wa{padding:8px 8px;white-space:nowrap;font-size:.92rem;min-width:0}
.buyrow .btn.wa span{overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.cart span{display:none}.wm{display:none}.acct{max-width:96px;padding-inline:10px}.langbtn{min-width:44px;padding-inline:8px}.acts{gap:6px}}
</style>

function trs(s){
  if(LANG!=='ar')return s;
  var raw=String(s),k=raw.trim();if(!k)return s;
  if(Object.prototype.hasOwnProperty.call(AR,k))return raw.replace(k,AR[k]);
  for(var i=0;i<ARP.length;i++){var m=k.match(ARP[i][0]);if(m)return raw.replace(k,ARP[i][1](m))}
  if(k.indexOf(' · ')>0){var ps=k.split(' · '),ch=false,o=ps.map(function(p){var v=trs(p);if(v!==p)ch=true;return v});if(ch)return raw.replace(k,o.join(' · '))}
  return s;
}
var I18A=['placeholder','aria-label','title'];
function trAttrs(el){for(var i=0;i<I18A.length;i++){var v=el.getAttribute(I18A[i]);if(v){var t=trs(v);if(t!==v)el.setAttribute(I18A[i],t)}}}
function trNode(n){
  if(n.nodeType===3){var p=n.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName)||(p.closest&&p.closest('[data-nt],#msgs')))return;var v=trs(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}
  if(n.nodeType!==1||(n.closest&&n.closest('[data-nt],#msgs')))return;
  var w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,null),t,a=[];while((t=w.nextNode()))a.push(t);a.forEach(trNode);
  trAttrs(n);$$('[placeholder],[aria-label],[title]',n).forEach(trAttrs);
}
var i18nObs=null;
function watchI18n(){
  if(i18nObs){i18nObs.disconnect();i18nObs=null}
  if(LANG!=='ar')return;
  var cfg={childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:I18A},root=$('#app');
  i18nObs=new MutationObserver(function(ms){
    i18nObs.disconnect();
    try{ms.forEach(function(m){
      if(m.type==='childList')m.addedNodes.forEach(trNode);
      else if(m.type==='characterData')trNode(m.target);
      else if(m.type==='attributes')trAttrs(m.target);
    })}finally{i18nObs.observe(root,cfg)}
  });
  i18nObs.observe(root,cfg);trNode(root);
}

function wrapLines(text,max){var w=text.toUpperCase().split(/\s+/),lines=[],cur='';w.forEach(function(x){if((cur+' '+x).trim().length>max&&cur){lines.push(cur);cur=x}else cur=(cur+' '+x).trim()});if(cur)lines.push(cur);return lines}

  var ps5=g.plat==='PS5';

function lev(a,b,max){

  else{m=s.match(/(\d{3,5})\s*(?:egp|le|جنيه|ج\.?م)/);if(m){cap=Number(m[1]);s=s.replace(m[0],' ')}}
  var plat='',r5=/\bps\s?5\b|playstation\s?5|بلايستيشن\s?5|بي\s?اس\s?5/g,r4=/\bps\s?4\b|playstation\s?4|بلايستيشن\s?4|بي\s?اس\s?4/g;
  if(r5.test(s)){plat='PS5';s=s.replace(r5,' ')}else if(r4.test(s)){plat='PS4';s=s.replace(r4,' ')}
  var so=false;if(/\b(available|instock)\b|متاح|متوفر|موجود/.test(s)){so=true;s=s.replace(/\b(available|instock)\b|متاح|متوفر|موجود/g,' ')}
  var w=norm(s).split(' ').filter(Boolean),out=[],i;
  for(i=0;i<w.length;i++){
    var t3=w.slice(i,i+3).join(' '),t2=w.slice(i,i+2).join(' ');
    if(w[i+2]&&ARQ[t3]){out.push(ARQ[t3]);i+=2}
    else if(w[i+1]&&ARQ[t2]){out.push(ARQ[t2]);i+=1}
    else if(ARQ[w[i]])out.push(ARQ[w[i]]);
    else out.push(w[i]);
  }
  var toks=out.join(' ').split(' ').filter(function(t){return t&&!STOPQ[t]}).map(function(t){return ROM[t]||t});
  return {tokens:toks,cap:cap,plat:plat,stockOnly:so};
}
function scoreItem(g,p){
  if(p.plat&&g.plat!==p.plat)return -1;
  if(p.cap&&g.price>p.cap)return -1;
  if(p.stockOnly&&!inStock(g))return -1;
  var ix=idx(g),sc=0,qs=p.tokens.join(' '),qc=p.tokens.join('');
  if(p.tokens.length){
    for(var i=0;i<p.tokens.length;i++){var s=tokScore(p.tokens[i],ix);if(!s)return -1;sc+=s}
    if(ix.full===qs)sc+=20;else if(ix.full.indexOf(qs)===0)sc+=8;else if(qc&&ix.c.indexOf(qc)>=0)sc+=4;
  }else sc=1;
  if(inStock(g))sc+=.5;if(g.feat)sc+=.2;
  return sc;
}
function searchItems(q){
  var p=parseQ(q);if(!p.tokens.length&&!p.cap&&!p.plat&&!p.stockOnly)return [];
  var res=[];S.items.forEach(function(g){var s=scoreItem(g,p);if(s>=0)res.push({g:g,s:s})});
  res.sort(function(a,b){return b.s-a.s||a.g.title.localeCompare(b.g.title)});
  return res;
}
function matches(g,q){if(!q)return true;return scoreItem(g,parseQ(q))>=0}
function didYouMean(q){
  var qc=parseQ(q).tokens.join('');if(qc.length<3)return null;
  var best=null,bd=1e9,lim=Math.max(2,Math.floor(qc.length*.34));
  S.items.forEach(function(g){
    var ts=toksOf(g.title),c=ts.join(''),d=lev(qc,c,lim);
    ts.forEach(function(t){if(t.length>=4){var d2=lev(qc,t,lim)+1;if(d2<d)d=d2}});
    if(d<bd){bd=d;best=g}
  });
  return bd<=lim?best:null;
}

function saveRecent(q){try{var a=recent().filter(function(x){return x!==q});a.unshift(q);localStorage.setItem('sgs-recent',JSON.stringify(a.slice(0,5)))}catch(e){}}

function swapOne(a,b){if(a.length!==b.length||a.length<3)return false;for(var i=0;i<a.length-1;i++){if(a.charAt(i)!==b.charAt(i)){return a.charAt(i)===b.charAt(i+1)&&a.charAt(i+1)===b.charAt(i)&&a.slice(i+2)===b.slice(i+2)}}return false}
function vocab(){var v={};S.items.forEach(function(g){toksOf(g.title+' '+(g.alt||'')).forEach(function(t){if(t.length>=3&&!/^\d+$/.test(t))v[t]=(v[t]||0)+1})});return v}
function correctQuery(q){
  var p=parseQ(q);if(!p.tokens.length)return null;
  var vb=vocab(),words=Object.keys(vb),changed=false,out=p.tokens.map(function(t){
    if(vb[t]||/^\d+$/.test(t)||t.length<3)return t;
    var best=t,bs=1e9;
    words.forEach(function(w){var mx=Math.max(1,Math.min(3,Math.floor(Math.max(t.length,w.length)*.5))),d=swapOne(t,w)?1:lev(t,w,mx);
      if(d<=mx){var sc=d*10-(w.charAt(0)===t.charAt(0)?5:0)-Math.min(vb[w],4)*.5;if(sc<bs){bs=sc;best=w}}});
    if(best!==t)changed=true;return best;
  });
  if(!changed)return null;
  return out.join(' ')+(p.plat?' '+p.plat:'')+(p.cap?' under '+p.cap:'');
}

  });
  return a;
}

  $('#qclr').hidden=!q;
  if(!q){
    var rc=recent();if(!rc.length){box.hidden=true;return}
    box.innerHTML='<div class="sg-h">'+esc(L('Recent searches','عمليات البحث الأخيرة'))+'</div>'+rc.map(function(r){return '<button type="button" class="sg-all" data-act="recent" data-val="'+esc(r)+'">'+esc(r)+'</button>'}).join('');
    box.hidden=false;return;
  }
  var r=searchItems(q),fx='';if(!r.length){fx=correctQuery(q)||'';if(fx)r=searchItems(fx)}
  var top=r.slice(0,6);
  if(!top.length){
    var dm=didYouMean(q);
    box.innerHTML='<div style="padding:14px 16px"><b>No match for "'+esc(q)+'"</b><div class="muted" style="font-size:.85rem;margin-top:4px">Press Enter to search again, or ask the assistant.</div></div>'+(dm?'<button type="button" class="sg-all" data-act="recent" data-val="'+esc(dm.title)+'">'+esc(L('Did you mean','هل تقصد'))+': '+esc(dm.title)+' ?</button>':'')+'<button type="button" class="sg-all" data-act="askq">Ask the assistant</button>';
    box.hidden=false;return;
  }
  box.innerHTML=top.map(function(x){var g=x.g;return '<button type="button" class="sg" data-act="open" data-id="'+g.id+'"><div class="mc">'+coverHTML(g,'s')+'</div><div style="min-width:0"><b>'+esc(g.title)+'</b><span>'+esc(g.kind==='acc'?'Accessory':g.plat)+' · '+(inStock(g)?'In stock':'Out of stock')+'</span></div><em>'+fmt(g.price)+'</em></button>'}).join('')+(r.length>6?'<button type="button" class="sg-all" data-act="seeall">See all '+r.length+' results</button>':'');
  box.hidden=false;
}

function b64(buf){var s='',b=new Uint8Array(buf);for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
async function pwHash(pw,salt){
  try{var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},k,256))}
  catch(e){return 'x'+hash(salt+pw)}
}

async function gateSubmit(){
  var mode=$('#gateForm').dataset.mode,email=$('#g-email').value.trim().toLowerCase(),pw=$('#g-pass').value,err=$('#g-err'),accts=getAccts();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){err.textContent=L('Enter a valid email.','أدخل بريداً إلكترونياً صحيحاً.');return}
  if(pw.length<6){err.textContent=L('Password must be at least 6 characters.','كلمة المرور 6 أحرف على الأقل.');return}
  if(email&&email===adminMail()){
    if(mode==='up'){err.textContent=L('This email belongs to the store admin. Use Log in.','هذا البريد خاص بمدير المتجر. استخدم تسجيل الدخول.');return}
    var ah=await pwHash(pw,String(S.settings.adminSalt||''));
    if(S.settings.adminH&&ah===S.settings.adminH){enterAdmin();return}
    err.textContent=L('Email or password is not right.','البريد الإلكتروني أو كلمة المرور غير صحيحة.');return;
  }
  if(mode==='up'){
    var nm=$('#g-name').value.trim();if(!nm){err.textContent=L('Enter your name.','أدخل اسمك.');return}
    if(accts[email]){err.textContent=L('An account with this email already exists here. Log in instead.','يوجد حساب بهذا البريد. سجّل الدخول.');return}
    var salt=String(Math.random()).slice(2)+Date.now(),h=await pwHash(pw,salt);
    accts[email]={name:nm,email:email,salt:salt,h:h};setAccts(accts);startSession(accts[email]);hideGate();toast(L('Welcome, ','أهلاً بك، ')+nm);
  }else{
    var a=accts[email];
    if(!a||(await pwHash(pw,a.salt))!==a.h){err.textContent=L('Email or password is not right on this device. New here? Sign up.','البريد أو كلمة المرور غير صحيحة على هذا الجهاز. جديد؟ أنشئ حساباً.');return}
    startSession(a);hideGate();toast(L('Welcome back, ','أهلاً بعودتك، ')+a.name);
  }
}

async function publish(){
  if(publishing||!dirty)return;
  if(!HOSTED){await ghPublish();return}
  var art=null;try{art=await window.claude.use('artifact')}catch(e){}
  if(!art){toast('To publish, open this page while signed in to the Claude account that owns it.');return}
  publishing=true;renderAdminBar();
  S.updated=new Date().toISOString().slice(0,10);
  try{sessionStorage.setItem('sgs-admin','1')}catch(e){}
  try{await art.publish(buildDoc(false));dirty=0;toast('Published. Reloading the live page.')}
  catch(e){
    var c=e&&e.code,m='Could not publish. Try again in a moment.';
    if(c==='conflict')m='The page was changed somewhere else. It is reloading, then repeat your edit.';
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required')m='Publishing needs the Claude account that owns this page. Open the page while signed in to it.';
    else if(c==='too_large')m='The page is too large. Remove some uploaded cover photos and try again.';
    else if(c==='rate_limited')m='Publishing too fast. Wait a few seconds and try again.';
    toast(m);
  }
  publishing=false;renderAdminBar();
}

/* ---------- go live: publish straight to GitHub (no manual upload) ---------- */
function ghCfg(){try{var c=JSON.parse(localStorage.getItem('sgs-gh')||'null');return c&&c.owner&&c.repo&&c.token?c:null}catch(e){return null}}
function ghGuess(){
  var h=location.hostname,p=location.pathname.split('/').filter(Boolean),o='',r='';
  var m=h.match(/^([^.]+)\.github\.io$/i);if(m){o=m[1];r=p[0]&&!/\.html?$/i.test(p[0])?p[0]:m[1]+'.github.io'}
  return {owner:o,repo:r,branch:'main'};
}
function openGh(){
  var c=ghCfg()||{},g=ghGuess();
  openModal('<div class="mbox" role="dialog" aria-label="Go live setup"><button class="x" data-act="close" aria-label="Close">&times;</button><form class="form" id="ghForm"><h2>Go live setup</h2>'+
  '<p class="muted" style="margin:0">One time only. After this, <b>Publish changes</b> sends your edits straight to the live site. No uploading files to GitHub.</p>'+
  '<div class="two"><div class="fld"><label for="gh-o">GitHub username</label><input id="gh-o" type="text" value="'+esc(c.owner||g.owner)+'" dir="ltr" autocapitalize="off"></div><div class="fld"><label for="gh-r">Repository name</label><input id="gh-r" type="text" value="'+esc(c.repo||g.repo)+'" dir="ltr" autocapitalize="off"></div></div>'+
  '<div class="two"><div class="fld"><label for="gh-b">Branch</label><input id="gh-b" type="text" value="'+esc(c.branch||g.branch)+'" dir="ltr"></div><div class="fld"><label for="gh-t">Access token</label><input id="gh-t" type="password" value="'+esc(c.token||'')+'" dir="ltr" autocomplete="off" placeholder="github_pat_..."></div></div>'+
  '<div class="muted" style="font-size:.82rem;line-height:1.5"><b>How to get the token:</b> GitHub &rarr; your profile picture &rarr; Settings &rarr; Developer settings &rarr; Personal access tokens &rarr; <b>Fine-grained tokens</b> &rarr; Generate new token. Repository access: <b>Only select repositories</b> and pick this repository. Permissions &rarr; Repository permissions &rarr; <b>Contents: Read and write</b>. Copy the token and paste it above.<br>The token is saved only in this browser. Never share it. If you lose a device, delete the token on GitHub.</div>'+
  '<div id="ghMsg" class="muted" role="status"></div>'+
  '<div class="row-end"><div class="g"><button class="btn red" type="submit">Save</button><button class="btn" id="ghTest" type="button">Test connection</button><button class="btn ghost" type="button" data-act="close">Cancel</button></div><button class="btn ghost sm" id="ghDl" type="button">Or download index.html</button></div></form></div>');
}
function ghFromForm(){return {owner:$('#gh-o').value.trim(),repo:$('#gh-r').value.trim(),branch:($('#gh-b').value.trim()||'main'),token:$('#gh-t').value.trim()}}
function ghApi(c,path,opt){
  opt=opt||{};
  return fetch('https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+path,{method:opt.method||'GET',headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){
    return r.text().then(function(tx){var j=null;try{j=tx?JSON.parse(tx):null}catch(e){}if(!r.ok){var e=new Error((j&&j.message)||('HTTP '+r.status));e.status=r.status;throw e}return j});
  });
}
function ghErr(e){
  var s=e&&e.status;
  if(s===401)return 'The token is not valid or has expired. Create a new one and paste it in Live setup.';
  if(s===403)return 'GitHub refused. Check the token has Contents: Read and write on this repository, or wait a minute and try again.';
  if(s===404)return 'Repository or branch not found, or the token cannot see it. Check the username, repository name, branch and token access.';
  if(s===409||s===422)return 'GitHub says the repository changed. Try Publish again.';
  return 'Could not reach GitHub. Check your internet and try again.';
}
async function testGh(){
  var c=ghFromForm(),m=$('#ghMsg');if(!c.owner||!c.repo||!c.token){m.textContent='Fill in all fields first.';return}
  m.textContent='Testing...';
  try{var r=await ghApi(c,'');var ok=r&&r.permissions&&r.permissions.push;m.textContent=ok?'Connected. This token can publish to '+r.full_name+'.':'Connected, but this token can only read. Give it Contents: Read and write.'}
  catch(e){m.textContent=ghErr(e)}
}
function saveGh(){
  var c=ghFromForm();if(!c.owner||!c.repo||!c.token){$('#ghMsg').textContent='Fill in all fields first.';return}
  try{localStorage.setItem('sgs-gh',JSON.stringify(c))}catch(e){toast('This browser cannot save the setup.');return}
  closeModal();toast('Saved. Press Publish changes to go live.');
}
var ghDone={};
async function ghPublish(){
  var c=ghCfg();if(!c){toast('One-time setup needed first.');openGh();return}
  publishing=true;renderAdminBar();
  try{
    var ref=await ghApi(c,'/git/ref/heads/'+encodeURIComponent(c.branch).replace(/%2F/g,'/'));
    var head=ref.object.sha,cm=await ghApi(c,'/git/commits/'+head);
    var P=JSON.parse(JSON.stringify(S));P.rev=Date.now();P.updated=new Date().toISOString().slice(0,10);
    var tree=[],todo=[];
    P.items.forEach(function(g){
      if(g.img&&g.img.indexOf('data:')===0){
        var path='img/'+g.id+'-'+hash(g.img).toString(16)+'.jpg';
        if(!ghDone[path])todo.push({path:path,b64:g.img.slice(g.img.indexOf(',')+1)});
        g.img=path;
      }
    });
    var n=0,total=todo.length+1;
    async function up(it){var b=await ghApi(c,'/git/blobs',{method:'POST',body:{content:it.b64,encoding:'base64'}});tree.push({path:it.path,mode:'100644',type:'blob',sha:b.sha});n++;toast('Publishing '+n+' of '+total+'...')}
    var q=todo.slice(),workers=[];
    for(var w=0;w<4;w++)workers.push((async function(){while(q.length){await up(q.shift())}})());
    await Promise.all(workers);
    var jb=await ghApi(c,'/git/blobs',{method:'POST',body:{content:JSON.stringify(P),encoding:'utf-8'}});
    tree.push({path:'store-data.json',mode:'100644',type:'blob',sha:jb.sha});
    var nt=await ghApi(c,'/git/trees',{method:'POST',body:{base_tree:cm.tree.sha,tree:tree}});
    var nc=await ghApi(c,'/git/commits',{method:'POST',body:{message:'Update store from admin panel',tree:nt.sha,parents:[head]}});
    await ghApi(c,'/git/refs/heads/'+encodeURIComponent(c.branch).replace(/%2F/g,'/'),{method:'PATCH',body:{sha:nc.sha}});
    todo.forEach(function(it){ghDone[it.path]=true});
    S.updated=P.updated;S.rev=P.rev;dirty=0;
    toast('Published. Customers will see it in about a minute.');
  }catch(e){toast(ghErr(e))}
  publishing=false;renderAdminBar();
}
async function loadRemote(){
  if(HOSTED||!/^https?:$/.test(location.protocol))return;
  try{
    var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},8000);
    var r=await fetch('store-data.json?t='+Date.now(),{cache:'no-store',signal:ctl.signal});clearTimeout(tm);
    if(!r.ok)return;var d=await r.json();
    if(!d||!Array.isArray(d.items)||(d.rev||0)<(S.rev||0))return;
    if(dirty)return;
    S=d;ensureCats();renderAll();
  }catch(e){}
}

function localReply(q){
  var ar=LANG==='ar'||/[؀-ۿ]/.test(q),n=norm(arNorm(q)),items=S.items,ct=contactLine(),p=parseQ(q);
  function T(en,a){return ar?a:en}
  if(/^(hi|hello|hey|salam|مرحبا|اهلا|السلام|ازيك|هاي)/.test(n)&&n.length<24)return T('Hi! Ask me about any game, its price or whether it is in stock.','أهلاً! اسألني عن أي لعبة وسعرها وهل هي متاحة.');
  if(/(order|buy|checkout|cart|pay|payment|اطلب|اشتري|شراء|ادفع|دفع|الدفع|اطلب)/.test(n)&&!p.tokens.some(function(t){return !/^(order|buy|pay|payment|checkout|cart|how|اطلب|اشتري)$/.test(t)&&items.some(function(g){return toksOf(g.title).indexOf(t)>=0})}))return howSteps().map(function(s,i){return (i+1)+'. '+s}).join('\n')+(S.settings.payments?'\n'+T('We accept: ','طرق الدفع: ')+S.settings.payments:'');
  for(var i=0;i<KB.length;i++){if(KB[i].re.test(n)||KB[i].re.test(String(q).toLowerCase()))return ar?KB[i].ar:KB[i].en}
  if(/(deliver|shipping|return|refund|location|address|where|open|hours|phone|contact|whatsapp|توصيل|شحن|استرجاع|عنوان|فين|مواعيد|رقم|تواصل|واتساب)/.test(n))return (ct?T('Here is what I have: ','دي بيانات المتجر: ')+ct+'.\n':'')+T('For delivery and returns, please contact the store directly.','للتوصيل والاسترجاع تواصل مع المتجر مباشرة.');
  var cap=p.cap;
  var res=[];
  if(p.tokens.length){res=items.filter(function(g){return scoreItem(g,p)>=0})}
  if(res.length&&res.length<=40){
    res.sort(function(a,b){return scoreItem(b,p)-scoreItem(a,p)});
    return res.slice(0,5).map(function(g){return '**'+g.title+'** ['+(g.kind==='acc'?T('Accessory','إكسسوار'):g.plat)+'] EGP '+fmt(g.price)+' - '+(inStock(g)?T('in stock','متاح'):T('out of stock','غير متاح'))+' [#'+g.id+']'}).join('\n')+(res.length>5?'\n'+T('...and '+(res.length-5)+' more. Try the search bar for the full list.','...و'+(res.length-5)+' كمان. جرب البحث لعرض القائمة كاملة.'):'');
  }
  if(cap||p.plat||/(recommend|suggest|best|good|play|popular|kids|family|children|رشح|ارشح|احسن|افضل|اطفال|عائلي|العب)/.test(n)){
    var pool=items.filter(function(g){return g.kind!=='acc'&&inStock(g)&&(!p.plat||g.plat===p.plat)&&(!cap||g.price<=cap)});
    var kids=/(kids|children|family|اطفال|عائلي)/.test(n);if(kids)pool=pool.filter(function(g){return g.genre==='Family'});
    var gh=null;S.cats.forEach(function(x){if(n.indexOf(norm(x))>=0)gh=x});if(gh)pool=pool.filter(function(g){return g.genre===gh});
    pool.sort(function(a,b){return (b.feat?1:0)-(a.feat?1:0)||b.price-a.price});
    if(pool.length)return T('Here are some in-stock picks'+(cap?' under EGP '+fmt(cap):'')+':\n','ترشيحات متاحة'+(cap?' تحت '+fmt(cap)+' جنيه':'')+':\n')+pool.slice(0,6).map(function(g){return '**'+g.title+'** ['+g.plat+'] EGP '+fmt(g.price)+' [#'+g.id+']'}).join('\n');
  }
  var dm=didYouMean(q);
  return (dm?T('Did you mean **'+dm.title+'** [#'+dm.id+']?\n','تقصد **'+dm.title+'** [#'+dm.id+']؟\n'):'')+T('I could not find that in the current list. It may still be available, so please ask the store'+(ct?' ('+ct+')':'')+'. You can also try the search bar.','مش لاقيها في القائمة الحالية. ممكن تكون متاحة، فاسأل المتجر'+(ct?' ('+ct+')':'')+'. ممكن كمان تجرب البحث.');
}
async function sendAI(text){
  text=String(text||'').trim();if(!text||aiBusy)return;
  addMsg('u',text);$('#aiIn').value='';aiBusy=true;$('#aiGo').disabled=true;
  aiHist.push({role:'user',content:text});if(aiHist.length>12)aiHist=aiHist.slice(-12);
  var bubble=addMsg('b',L('Thinking...','جاري التفكير...'),'think');var reply='';
  if(sampleFn){
    aiCtl=new AbortController();
    try{
      var turns=[{role:'user',content:rules()}].concat(aiHist);
      var r=await sampleFn(turns,{cache:false,modelTier:'quick',signal:aiCtl.signal,onText:function(u){bubble.className='m b';bubble.innerHTML=rich(u.text);$('#msgs').scrollTop=1e9}});
      reply=r.text;
    }catch(e){
      var c=e&&e.code;
      if(c==='cancelled'){bubble.remove();aiBusy=false;$('#aiGo').disabled=false;aiHist.pop();return}
      if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed')sampleFn=null;
      reply='';
    }
    aiCtl=null;
  }
  if(!reply)reply=localReply(text);
  bubble.className='m b';bubble.innerHTML=rich(reply);aiHist.push({role:'assistant',content:reply});
  $('#msgs').scrollTop=1e9;aiBusy=false;$('#aiGo').disabled=false;
}
